<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="t d">
  <title id="t">Muhammad Adeel</title>
  <desc id="d">Animated banner: Muhammad Adeel, Full-Stack Developer, with rolling water waves</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="0.6" stop-color="#0C2A3A"/>
      <stop offset="1" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#A5F3FC"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#22D3EE" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-60%" width="140%" height="220%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <clipPath id="card"><rect width="1200" height="320" rx="18"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="1200" height="320" fill="url(#bg)"/>
    <ellipse cx="600" cy="120" rx="520" ry="130" fill="url(#glow)"/>

    <!-- rising bubbles -->
    <g fill="none" stroke="#22D3EE" stroke-width="1.5">
      <circle cx="140" cy="300" r="4" opacity="0">
        <animate attributeName="cy" values="300;70" dur="9s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.55;0" dur="9s" repeatCount="indefinite"/>
      </circle>
      <circle cx="330" cy="310" r="3" opacity="0">
        <animate attributeName="cy" values="310;50" dur="12s" begin="-4s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="12s" begin="-4s" repeatCount="indefinite"/>
      </circle>
      <circle cx="880" cy="300" r="5" opacity="0">
        <animate attributeName="cy" values="300;60" dur="10s" begin="-2s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.5;0" dur="10s" begin="-2s" repeatCount="indefinite"/>
      </circle>
      <circle cx="1050" cy="310" r="3" opacity="0">
        <animate attributeName="cy" values="310;80" dur="13s" begin="-7s" repeatCount="indefinite"/>
        <animate attributeName="opacity" values="0;0.45;0" dur="13s" begin="-7s" repeatCount="indefinite"/>
      </circle>
    </g>

    <!-- floating name block -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -7;0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="5s" repeatCount="indefinite"/>
      <text x="600" y="98" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="#22D3EE" opacity="0.55" filter="url(#soft)">Muhammad Adeel</text>
      <text x="600" y="98" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="56" font-weight="700" fill="url(#nameGrad)" letter-spacing="1">Muhammad Adeel</text>
      <text x="600" y="134" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" fill="#CBD5E1" letter-spacing="3">FULL-STACK DEVELOPER  ·  AI-POWERED WEB APPS  ·  MOBILE  ·  CLOUD</text>
    </g>

    <!-- floating roles block, out of phase with the name -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -5;0 0" keyTimes="0;0.5;1" calcMode="spline" keySplines="0.45 0 0.55 1;0.45 0 0.55 1" dur="4.2s" begin="-1.6s" repeatCount="indefinite"/>

      <g font-family="'Fira Code', Consolas, Menlo, monospace" font-size="24" font-weight="600" fill="#22D3EE" text-anchor="middle">
        <text x="600" y="176" opacity="0">Full Stack Web Developer
          <animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;0.025;0.175;0.2;1" dur="20s" repeatCount="indefinite"/>
        </text>
        <text x="600" y="176" opacity="0">React / Next.js / Node.js Engineer
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2;0.225;0.375;0.4;1" dur="20s" repeatCount="indefinite"/>
        </text>
        <text x="600" y="176" opacity="0">Flutter Mobile App Builder
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.4;0.425;0.575;0.6;1" dur="20s" repeatCount="indefinite"/>
        </text>
        <text x="600" y="176" opacity="0">AI-Powered Web App Developer
          <animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.6;0.625;0.775;0.8;1" dur="20s" repeatCount="indefinite"/>
        </text>
        <text x="600" y="176" opacity="0">Building real projects at itShifts Technologies
          <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.8;0.825;0.975;1" dur="20s" repeatCount="indefinite"/>
        </text>
      </g>

      <text x="600" y="208" text-anchor="middle" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" fill="#94A3B8" letter-spacing="1.5">Software Engineering Student @ COMSATS University Islamabad  ·  Freelancer</text>
    </g>

    <!-- back wave -->
    <g transform="translate(0,236)">
      <path fill="#22D3EE" fill-opacity="0.30" d="M0,0 q100,-20 200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 V100 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="11s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- middle wave -->
    <g transform="translate(0,252)">
      <path fill="#0E7490" fill-opacity="0.70" d="M0,0 q100,-16 200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 V100 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="-400 0" to="0 0" dur="8s" repeatCount="indefinite"/>
      </path>
    </g>
    <!-- front wave -->
    <g transform="translate(0,270)">
      <path fill="#0B1220" fill-opacity="0.92" d="M0,0 q100,-12 200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 t200,0 V100 H0 Z">
        <animateTransform attributeName="transform" type="translate" from="0 0" to="-400 0" dur="6s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="18" fill="none" stroke="#22D3EE" stroke-opacity="0.35"/>
</svg>
